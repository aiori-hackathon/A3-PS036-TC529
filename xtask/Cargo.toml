[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

description = "cargo-xtask automation: pin-env, bench-all, report, wire-report"

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
default = ["native"]
# Link the native measurement stack. Turning this off lets the viewer CI job
# build and run `source-hygiene`, `check-pins`, `mermaid-lint`, `link-check`
# and `workflows` on a runner that has no `.mtl-install` prefix.
native = [
    "dep:climb-mtl",
    "dep:climb-mtl-sys",
    "climb-bench/native",
    "climb-report/native",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
roxmltree = "0.20"
sha2.workspace = true
toml.workspace = true
ttf-parser = "0.20"
climb-bench = { path = "../crates/climb-bench", default-features = false }
climb-dns = { path = "../crates/climb-dns" }
climb-analytical = { path = "../crates/climb-analytical" }
climb-mtl = { path = "../crates/climb-mtl", optional = true }
climb-mtl-sys = { path = "../crates/climb-mtl-sys", optional = true }  # direct dep so DEP_MTLSLIB_LIB_DIR flows to build.rs
climb-report = { path = "../crates/climb-report", default-features = false }
climb-tui = { path = "../crates/climb-tui", default-features = false }
regex-lite = "0.1"
[dev-dependencies]
tempfile = "3"