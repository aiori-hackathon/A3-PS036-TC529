[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "cargo-xtask automation: pin-env, bench-all, report, wire-report"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
roxmltree = "0.20"
sha2.workspace = true
toml.workspace = true
ttf-parser = "0.20"
climb-bench = { path = "../crates/climb-bench" }
climb-dns = { path = "../crates/climb-dns" }
climb-analytical = { path = "../crates/climb-analytical" }
climb-mtl = { path = "../crates/climb-mtl" }
climb-mtl-sys = { path = "../crates/climb-mtl-sys" }  # direct dep so DEP_MTLSLIB_LIB_DIR flows to build.rs
climb-report = { path = "../crates/climb-report" }