name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  viewer:
    name: viewer (no native libraries)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          # Full public history for the commit-graph checks. The sample's
          # provenance is content-based and does not require its recorded commit.
          fetch-depth: 0

      - name: Load the CI environment
        run: ./scripts/ci/env.sh --github-env

      - name: Fetch remote branches and tags
        run: ./scripts/ci/fetch-remotes.sh

      - name: Environment report
        run: ./scripts/ci/environment-report.sh

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          cache: false
          # Written out rather than left to the action's default, so the local
          # CI replica can parse the same value from this file. The action only
          # sets RUSTFLAGS when it is not already set.
          rustflags: "-D warnings"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: viewer

      - name: Check formatting
        run: ./scripts/ci/format.sh

      - name: Lint viewer-scope crates with clippy
        run: ./scripts/ci/clippy-viewer.sh

      - name: Feature matrix (check and clippy)
        run: ./scripts/ci/feature-matrix-check.sh

      - name: Fetch main branch
        run: ./scripts/ci/fetch-main.sh

      - name: Check committed sample pair
        run: ./scripts/ci/sample-check.sh

      - name: Test viewer-scope crates
        run: ./scripts/ci/test-viewer.sh

      - name: Verify viewer build has no native dependencies
        run: ./scripts/ci/viewer-build.sh

      - name: Check source hygiene
        run: ./scripts/ci/source-hygiene.sh

      - name: Check supply-chain pins
        run: ./scripts/ci/check-pins.sh

      - name: Lint Mermaid diagrams
        run: ./scripts/ci/mermaid-lint.sh

      - name: Check relative links in README and docs
        run: ./scripts/ci/link-check.sh

      - name: Lint workflow files
        run: ./scripts/ci/workflows.sh

      - name: Upload failing viewer logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: viewer-test-logs
          path: target/test-logs/*.log
          if-no-files-found: ignore

  native:
    name: native (pinned Docker toolchain)
    needs: viewer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          # Full public history for the commit-graph checks. The sample's
          # provenance is content-based and does not require its recorded commit.
          fetch-depth: 0

      - name: Load the CI environment
        run: ./scripts/ci/env.sh --github-env

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          cache: false
          rustflags: "-D warnings"

      - name: Restore extracted native toolchain (.mtl-install)
        id: mtl-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .mtl-install
          key: mtl-install-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build', 'docker/extract-libs.sh', '.gitmodules') }}

      - name: Build and extract pinned native toolchain
        if: steps.mtl-cache.outputs.cache-hit != 'true'
        run: ./scripts/ci/native-toolchain.sh

      # Saved in its own step, so the extraction survives a later failure in
      # the same job instead of being discarded with the post-job cache.
      - name: Save extracted native toolchain (.mtl-install)
        if: steps.mtl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .mtl-install
          key: mtl-install-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build', 'docker/extract-libs.sh', '.gitmodules') }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native

      - name: Install documented system packages
        run: ./scripts/ci/system-deps.sh

      - name: Build workspace
        run: ./scripts/ci/build-workspace.sh

      - name: Test workspace
        run: ./scripts/ci/test-workspace.sh

      - name: Check documentation against quote sheet and artifacts
        run: ./scripts/ci/docs-check.sh

      - name: Verify published numbers from raw rows
        run: ./scripts/ci/verify-numbers.sh

      - name: Build audit pack
        run: ./scripts/ci/audit-pack.sh

      - name: Upload failing native logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-logs
          path: target/test-logs/*.log
          if-no-files-found: ignore

      - name: Upload audit pack artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-pack
          path: target/audit-pack.md
          if-no-files-found: error
