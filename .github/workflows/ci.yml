name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  viewer:
    name: viewer (no native libraries)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          # Full history so the committed sample's provenance commit resolves.
          fetch-depth: 0

      - name: Fetch remote branches and tags
        run: git fetch origin +refs/heads/*:refs/remotes/origin/*

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          cache: false

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: viewer

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint viewer-scope crates with clippy
        run: |
          set -o pipefail
          mkdir -p target/test-logs
          cargo clippy -p climb-dns -p climb-analytical -p climb-tui --no-default-features --all-targets -- -D warnings 2>&1 | tee target/test-logs/clippy-viewer.log
          cargo clippy -p climb-report --no-default-features -- -D warnings 2>&1 | tee target/test-logs/clippy-report.log


      - name: Fetch main branch
        run: git fetch origin main

      - name: Check committed sample pair
        run: cargo run -p xtask --no-default-features -- sample-check

      - name: Test viewer-scope crates
        run: |
          set -o pipefail
          mkdir -p target/test-logs
          cargo test -p climb-dns -p climb-analytical -p climb-tui --no-default-features 2>&1 | tee target/test-logs/viewer-dns-analytical-tui.log
          cargo test -p climb-report --no-default-features --lib 2>&1 | tee target/test-logs/viewer-report.log

      - name: Verify viewer build has no native dependencies
        run: ./scripts/check-viewer-build.sh

      - name: Check source hygiene
        run: cargo run -p xtask --no-default-features -- source-hygiene

      - name: Check supply-chain pins
        run: cargo run -p xtask --no-default-features -- check-pins

      - name: Lint Mermaid diagrams
        run: cargo run -p xtask --no-default-features -- mermaid-lint

      - name: Check relative links in README and docs
        run: cargo run -p xtask --no-default-features -- link-check

      - name: Lint workflow files
        run: cargo run -p xtask --no-default-features -- workflows

      - name: Upload failing viewer logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: viewer-test-logs
          path: target/test-logs/*.log
          if-no-files-found: ignore

  native:
    name: native (pinned Docker toolchain)
    needs: viewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          # Full history so the committed sample's provenance commit resolves.
          fetch-depth: 0

      - name: Install Rust toolchain from rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@1fbea72663f6d4c03efaab13560c8a24cfd2a7cc # v1.9.0
        with:
          cache: false

      - name: Cache extracted native toolchain (.mtl-install)
        id: mtl-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .mtl-install
          key: mtl-install-${{ runner.os }}-${{ hashFiles('docker/Dockerfile.build', 'docker/extract-libs.sh', '.gitmodules') }}

      - name: Build and extract pinned native toolchain
        if: steps.mtl-cache.outputs.cache-hit != 'true'
        run: |
          docker build -f docker/Dockerfile.build -t climb-builder:phase1 .
          ./docker/extract-libs.sh climb-builder:phase1

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: |
          set -o pipefail
          mkdir -p target/test-logs
          cargo test --workspace 2>&1 | tee target/test-logs/workspace.log

      - name: Check documentation against quote sheet and artifacts
        run: cargo run -p xtask -- docs-check

      - name: Verify published numbers from raw rows
        run: cargo run -p xtask -- verify-numbers

      - name: Build audit pack
        run: cargo run -p xtask -- audit-pack --reuse

      - name: Upload failing native logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-test-logs
          path: target/test-logs/*.log
          if-no-files-found: ignore

      - name: Upload audit pack artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-pack
          path: target/audit-pack.md
          if-no-files-found: error
