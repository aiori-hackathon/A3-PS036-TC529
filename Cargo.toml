[workspace]
resolver = "2"
members = [
    "crates/climb-mtl-sys",
    "crates/climb-mtl",
    "crates/climb-dns",
    "crates/climb-analytical",
    "crates/climb-report",
    "crates/climb-tui",
    "crates/climb-web",
    "crates/climb-bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aiori-hackathon/A3-PS036-TC529"
homepage = "https://github.com/aiori-hackathon/A3-PS036-TC529"
authors = ["Pratyay Mukherjee", "Mohit Kumar Yadav"]
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Configuration parsing for the generated README badge block.
toml = "1.1.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
hickory-proto = "0.26"
rand = "0.10"
rand_chacha = "0.10"
sysinfo = "0.33"
# Batch 6 demo layer (climb-tui). The terminal feature enables ratatui's `crossterm`
# backend, which resolves to crossterm 0.29 (via ratatui-crossterm's default
# `crossterm_0_29` feature), so the direct crossterm dependency is pinned to the same minor
# to keep a single copy in the graph. The backend is opt-in: the browser build uses
# ratzilla's backends and must not compile crossterm at all.
ratatui = { version = "0.30", default-features = false, features = ["underline-color"] }
crossterm = "0.29"
tracing-appender = "0.2"
plotters = { version = "0.3", default-features = false, features = [
    "svg_backend",
    "ttf",
    "line_series",
    "point_series",
    "errorbar",
] }

# Browser-only size profile. The wasm module is the one artifact with a byte
# budget, so it is the one build that should optimise for size. It is a named
# profile rather than `release` because the native release profile builds the
# Criterion binaries and the terminal dashboard, whose timings and draw times
# must not change.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
