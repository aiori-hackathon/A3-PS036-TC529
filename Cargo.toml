[workspace]
resolver = "2"
members = [
    "crates/climb-mtl-sys",
    "crates/climb-mtl",
    "crates/climb-dns",
    "crates/climb-analytical",
    "crates/climb-report",
    "crates/climb-tui",
    "crates/climb-bench",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/climb"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Configuration parsing for the generated README badge block.
toml = "1.1.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
hickory-proto = "0.26"
rand = "0.10"
rand_chacha = "0.10"
sysinfo = "0.33"
# Batch 6 demo layer (climb-tui). ratatui's default `crossterm` backend resolves to
# crossterm 0.29 (via ratatui-crossterm's default `crossterm_0_29` feature), so the direct
# crossterm dependency is pinned to the same minor to keep a single copy in the graph.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
tracing-appender = "0.2"
plotters = { version = "0.3", default-features = false, features = [
    "svg_backend",
    "ttf",
    "line_series",
    "point_series",
    "errorbar",
] }