# CLIMB brand colours, sampled from the original artwork.
#
# The values below are measured from docs/media/source/climb-logo-original.png
# by scripts/logo/make_assets.py: for each ink family the most common colour
# inside the dense core of that family is taken, so anti-aliased edge pixels
# cannot drag the sample towards the white paper.

[brand]
paper = "#FFFFFF"
panel_margin = "#F5F9FA"

[brand.slate]
hex = "#38454E"
rgb = [56, 69, 78]
family_median = "#39444E"
family_pixels = 37228
light_theme_contrast = 9.86
dark_theme_contrast = 1.92

[brand.orange]
hex = "#C55E33"
rgb = [197, 94, 51]
family_median = "#C25D34"
family_pixels = 17958
light_theme_contrast = 4.18
dark_theme_contrast = 4.53

[brand.teal]
hex = "#5C8E8D"
rgb = [92, 142, 141]
family_median = "#5D8A89"
family_pixels = 12083
light_theme_contrast = 3.68
dark_theme_contrast = 5.14

[dark_theme]
background = "#0D1117"
preview_background = "#0B0D10"
ink = "#E6EDF3"
minimum_contrast = 3.0

[dark_theme.slate]
source = "#38454E"
replacement = "#E6EDF3"
contrast_against_background = 1.92
reason = "recoloured to the light slate"

[dark_theme.orange]
source = "#C55E33"
replacement = "#C55E33"
contrast_against_background = 4.53
reason = "kept: 4.53:1 already reaches 3:1"

[dark_theme.teal]
source = "#5C8E8D"
replacement = "#5C8E8D"
contrast_against_background = 5.14
reason = "kept: 5.14:1 already reaches 3:1"
