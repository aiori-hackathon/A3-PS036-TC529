# README badge block — the single source of truth for the badge rows in
# README.md.
#
# `cargo xtask readme-badges` reads this file and rewrites the block between
# the `<!-- badges:begin -->` and `<!-- badges:end -->` markers. Nothing inside
# that block is typed by hand: the claims count is read from the claims
# registry of the consolidated results artifact, and `cargo xtask docs-check`
# regenerates the block and fails when the committed copy has drifted.
#
# This file is committed and mirrored publicly, so it carries no secrets.

[badges]
# The shields.io rendering style, and the colour of the small logo glyphs.
style = "for-the-badge"
logo_color = "white"

# Where the badges link to. A badge names one of these keys in its `link`
# field; adding a link here makes it available to every badge.
[badges.links]
portal = "https://portal.aiori.in/aiori-3/hackathon-guideline/"
video = "https://www.youtube.com/watch?v=gDHYamjWmtE"
rust = "https://www.rust-lang.org/"
claims = "docs/deck-facts.md"

# The brand palette, sampled from the artwork and recorded in
# docs/media/brand.toml. A badge names one of these keys in its colour fields.
# Every ink clears 3:1 against white text.
[badges.colours]
orange = "#C55E33"
slate = "#38454E"
teal = "#5C8E8D"

# The identity row: who the submission is.

[badges.hackathon]
label = "AIORI 3"
message = "Hackathon"
alt = "AIORI 3 Hackathon — open the hackathon guidelines"
link = "portal"
label_color = "slate"
message_color = "orange"

[badges.problem_statement]
label = "problem statement"
message = "PS-036"
alt = "Problem statement PS-036 — open the hackathon guidelines"
link = "portal"
label_color = "slate"
message_color = "orange"

[badges.track]
label = "track 2"
message = "Cyber Security"
alt = "Track 2 Cyber Security — open the hackathon guidelines"
link = "portal"
label_color = "slate"
message_color = "orange"

# The proof row: what backs the submission.

[badges.built_with]
label = "built with"
message = "Rust"
alt = "Built with Rust"
link = "rust"
label_color = "slate"
message_color = "teal"
logo = "rust"

[badges.video]
label = "intro video"
message = "YouTube"
alt = "YouTube introduction video — watch the team introduction"
link = "video"
label_color = "slate"
message_color = "teal"
logo = "youtube"

# The claims badge: `{claims}` is replaced by the number of claims that
# re-resolve in the results artifact, or by `unavailable` when the artifact is
# missing.
[badges.claims]
label = "claims verified"
message = "{claims}"
alt = "Claims verified: {claims}"
link = "claims"
label_color = "teal"
message_color = "orange"

# ── Commit graph ─────────────────────────────────────────────────────────────
#
# `cargo xtask commit-graph` reads the repository's git history up to one
# commit and writes docs/media/commit-graph.json plus four SVG variants: a wide
# card, a narrow card and their two compact strips. The output is a pure
# function of the history and everything below: rerunning it for the same
# commit produces identical bytes.

[commit_graph]
# Dates are bucketed in this zone. Only fixed-offset zones are accepted
# (Asia/Kolkata is UTC+05:30 all year), so the bucketing cannot depend on the
# tz database installed on the machine that runs the generator.
timezone = "Asia/Kolkata"

# The public repository whose history the committed card describes. When this
# checkout's `origin` is not this repository, `cargo xtask commit-graph` reads a
# bare cache of it instead of the checkout's own log, so the card never
# describes a private, rewritten history. The cache is cloned on first use and
# fetched afterwards, without credentials.
source_url = "https://github.com/aiori-hackathon/A3-PS036-TC529.git"
source_ref = "main"
source_cache = "target/commit-graph-source.git"

# Human-facing URL used for the README's commit permalink.
repo_web_url = "https://github.com/aiori-hackathon/A3-PS036-TC529"

# Bots are hidden from the contributor breakdown by git author NAME, never by
# email address. Their commits are still counted: the total must equal the
# commit count the public repository shows.
exclude_authors = ["dependabot[bot]", "github-actions[bot]", "renovate[bot]"]

# A commit whose every changed file matches one of these patterns is a
# media-only graph refresh. It is counted like every other commit and reported
# separately with `totals.refresh_commits`, never hidden.
refresh_commits_whose_files_all_match = ["docs/media/commit-graph*"]

# The refresh commit also carries the README permalink rewrite, because that
# permalink names the same as-of commit. `README.md` is allowed beside a graph
# artifact; a README-only commit is never classified as a refresh.
refresh_commits_allow_readme = true

# Count the refresh commit that will carry this document. `as_of_sha` stays the
# public tip (the refresh commit's parent), the totals include that commit, the
# per-day counts show it on its own day and `totals.refresh_commits` includes
# it. The document records `pending_refresh` and `pending_date`.
self_count = true

# Both SVG cards stay at or below this size. Generation fails rather than
# writing an oversized card.
budget_kb = 50

# Both compact strips stay at or below this size. Generation fails rather than
# writing an oversized strip.
strip_budget_kb = 25

# `cargo xtask docs-check` warns (never fails) when the committed graph is
# further than this behind HEAD.
staleness_commits = 20
staleness_days = 7

# Presentation knobs. Every value has a default, so an older configuration
# file keeps working.
[commit_graph.style]
# Colour of the staircase and the day bars. This is the brand orange sampled
# from docs/media/brand.toml; orange never sets text.
accent = "#C55E33"
# Serif title set at the top of both cards.
title = "The Climb"
# Draw the milestone flags on the timeline.
show_flags = true
# Draw the day bars under the staircase.
show_bars = true
# Face for the title and the large numerals: Instrument Serif or JetBrains Mono.
display_font = "Instrument Serif"

# Display names are keyed by git author NAME (names only, never emails). An
# author with no mapping is shown under the name git reports.
[commit_graph.display_names]
"Pratyay Mukherjee" = "Pratyay Mukherjee"

# Milestones appear as flags on the timeline. Dates after the graph's as-of
# date are drawn dimmed and dashed.
[[commit_graph.milestones]]
date = "2026-10-14"
label = "Round 1 submission"
short = "Round 1"

[[commit_graph.milestones]]
date = "2026-10-20"
label = "Level 2 qualified"
short = "Level 2"

[[commit_graph.milestones]]
date = "2026-11-24"
label = "Regional hackathon"
short = "Regionals"

[[commit_graph.milestones]]
date = "2026-12-17"
label = "Finals, IIT Jammu"
short = "Finals"
