[package]
name = "climb-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

description = "Criterion benchmark suite — MTL vs non-MTL signing (Phase 5) and verification (Phase 6)"

[features]
default = ["native"]
# Native measurement support: links libMTL/liboqs and samples RSS through
# sysinfo. Every artifact *type* stays available without it, so read-only
# consumers can parse recorded reports without a native toolchain.
native = ["dep:climb-mtl-sys", "dep:climb-mtl", "dep:sysinfo"]

[[bench]]
name = "signing"
harness = false
required-features = ["native"]

[[bench]]
name = "verifying"
harness = false
required-features = ["native"]

[[bench]]
name = "classical"
harness = false
required-features = ["native"]

[[bench]]
name = "primitives"
harness = false
required-features = ["native"]

# These integration tests drive the real MTL signing path or parse its signed
# bytes, so they need the native measurement stack by construction.
[[test]]
name = "cross_validation"
path = "tests/cross_validation.rs"
required-features = ["native"]

[[test]]
name = "probes"
path = "tests/probes.rs"
required-features = ["native"]

[[test]]
name = "wire_accounting"
path = "tests/wire_accounting.rs"
required-features = ["native"]

[[test]]
name = "wire_size"
path = "tests/wire_size.rs"
required-features = ["native"]

[dependencies]
climb-mtl-sys = { path = "../climb-mtl-sys", optional = true }  # direct dep so DEP_MTLSLIB_LIB_DIR flows to build.rs
climb-mtl = { path = "../climb-mtl", optional = true }
climb-dns = { path = "../climb-dns" }
climb-analytical = { path = "../climb-analytical" }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
sysinfo = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
# Classical-signature baselines are measured for context only. These crates are
# dev-dependencies so they are never linked into any shipped binary.
ed25519-dalek = "2.2"
p256 = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }
[[bin]]
name = "mem_probe"
path = "src/bin/mem_probe.rs"
required-features = ["native"]
