[package]
name = "climb-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Criterion benchmark suite — MTL vs non-MTL signing (Phase 5) and verification (Phase 6)"

[[bench]]
name = "signing"
harness = false

[[bench]]
name = "verifying"
harness = false

[[bench]]
name = "classical"
harness = false

[[bench]]
name = "primitives"
harness = false

[dependencies]
climb-mtl-sys = { path = "../climb-mtl-sys" }  # direct dep so DEP_MTLSLIB_LIB_DIR flows to build.rs
climb-mtl = { path = "../climb-mtl" }
climb-dns = { path = "../climb-dns" }
climb-analytical = { path = "../climb-analytical" }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
sysinfo = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
# Classical-signature baselines are measured for context only. These crates are
# dev-dependencies so they are never linked into any shipped binary.
ed25519-dalek = "2.2"
p256 = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }
[[bin]]
name = "mem_probe"
path = "src/bin/mem_probe.rs"
