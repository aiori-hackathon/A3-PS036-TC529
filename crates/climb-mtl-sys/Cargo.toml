[package]
name = "climb-mtl-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Raw FFI bindings to libMTL (generated by bindgen in Phase 2)"
links = "mtlslib"
build = "build.rs"

[lib]
# bindgen copies C doc comments verbatim; some (e.g. liboqs `oqs.h`) contain
# indented C snippets that rustdoc mis-parses as Rust doctests. These bindings
# are machine-generated, so doctests carry no meaning anyway.
doctest = false

[dependencies]

[build-dependencies]
bindgen = "0.72"
