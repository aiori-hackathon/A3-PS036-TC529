[package]
name = "climb-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

description = "Ratatui live-run dashboard for benchmark visualization (Batch 6)"

[[bin]]
name = "climb-tui"
path = "src/main.rs"

[features]
default = ["native"]
# Link the native measurement stack through `climb-report`. The dashboard
# itself only reads artifacts, so a viewer-only build turns this off and needs
# no libMTL/liboqs/OpenSSL prefix.
native = ["climb-report/native"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
climb-analytical = { path = "../climb-analytical" }
climb-report = { path = "../climb-report", default-features = false }
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
# env-filter so log verbosity is filterable via RUST_LOG.
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
climb-bench = { path = "../climb-bench" }