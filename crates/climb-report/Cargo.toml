[package]
name = "climb-report"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

description = "Criterion output parsing, plain-text summaries (Batch 2), and chart/report generation (Batch 5)"

[[bin]]
name = "climb-site-data"
path = "src/bin/climb-site-data.rs"

# These contract tests render the SVG charts, which need `plotters`. They are
# native-feature targets by construction, so a viewer build neither compiles nor
# runs them.
[[test]]
name = "cache_contract"
path = "tests/cache_contract.rs"
required-features = ["native"]

[[test]]
name = "ladder_contract"
path = "tests/ladder_contract.rs"
required-features = ["native"]

[[test]]
name = "memory_contract"
path = "tests/memory_contract.rs"
required-features = ["native"]

[[test]]
name = "reuse_contract"
path = "tests/reuse_contract.rs"
required-features = ["native"]

[[test]]
name = "signing_baseline_contract"
path = "tests/signing_baseline_contract.rs"
required-features = ["native"]

[[test]]
name = "stability_contract"
path = "tests/stability_contract.rs"
required-features = ["native"]

[[test]]
name = "udp_fit_contract"
path = "tests/udp_fit_contract.rs"
required-features = ["native"]

[features]
default = ["native"]
# Native chart rendering (plotters) plus the native measurement crate it
# consumes. Read-only consumers such as the dashboard disable it so the whole
# dependency tree stays free of C libraries.
native = ["dep:plotters", "climb-bench/native"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
climb-analytical = { path = "../climb-analytical" }
climb-bench = { path = "../climb-bench", default-features = false }
climb-dns = { path = "../climb-dns" }
plotters = { workspace = true, optional = true }
[dev-dependencies]
proptest = "1"
tempfile = "3"
