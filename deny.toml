# Supply-chain policy for the CLIMB workspace.
#
# `cargo deny check` runs in `cargo xtask preflight` and in CI. `cargo audit`
# reads the same advisory database but has no per-advisory policy, so this file
# is the authoritative record of what is ignored and why.

[advisories]
# Every dependency comes from crates.io; the advisory database is fetched by
# cargo-deny and never vendored into the repository.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is a dev-dependency-only classical baseline (RSA-2048) in climb-bench; the benchmark never receives private keys over a network and ships no binary that links it" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint is reached only through the dev-dependency-only P-256/ECDSA classical baseline in climb-bench; the benchmark signs fixed test messages locally and ships no binary that links it" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained with no safe upgrade; it is reached only through plotters' text layout when rendering the repository's own SVG/PNG charts, where the fonts are bundled by this repository rather than supplied by a caller" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are reported for review, not rejected: the lockfile pins
# them for reproducibility and a transitive bump is not a workspace decision.
multiple-versions = "warn"
# Path dependencies on workspace crates are not published and carry no version
# requirement; treating them as wildcards would reject the workspace layout.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
