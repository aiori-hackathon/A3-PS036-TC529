# docker/compose.nsd.yml — CLIMB Phase 12
#
# Runs the patched NSD-MTL authoritative server serving a local-only zone.
#
# ── the project conventions §2.3 "No Internet deployment" compliance ──
# Ports are mapped to 127.0.0.1 ONLY (NOT 0.0.0.0, NOT any public interface).
# The NSD daemon itself binds to 0.0.0.0:53 inside the container, but the
# container's network namespace is isolated and the Compose port mapping
# restricts host-side exposure to localhost exclusively.
#
# Usage:
#   docker compose -f docker/compose.nsd.yml build
#   docker compose -f docker/compose.nsd.yml up -d
#   docker compose -f docker/compose.nsd.yml logs -f
#   dig @127.0.0.1 -p 5354 climb.example. A
#   docker compose -f docker/compose.nsd.yml down

services:

  nsd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nsd
      # target: not set — defaults to last stage (runtime)
    image: climb-nsd:phase12

    # ── Localhost-only port binding (the project conventions §2.3) ────────────────────
    # NSD listens on 0.0.0.0:53 inside the container. The host-side binding
    # to 127.0.0.1:5353 means the service is reachable from the developer's
    # machine ONLY — never from the LAN, never from the Internet.
    ports:
      - "127.0.0.1:5354:53/udp"
      - "127.0.0.1:5354:53/tcp"

    # ── Volume mounts for zone data and config ──────────────────────────
    # Zone files and nsd.conf are maintained on the host (version-controlled)
    # and bind-mounted read-only into the container. This avoids baking zone
    # data into the image and lets the human edit zones without rebuilding.
    volumes:
      - ./zones:/etc/nsd/zones:ro
      - ./configs/nsd.conf:/etc/nsd/nsd.conf:ro

    # ── Safety: no extra capabilities, no privileged mode ────────────────
    # NSD drops privileges to nobody:nogroup at runtime (see Dockerfile.nsd).
    # No NET_BIND_SERVICE needed because the container runs as USER nobody and
    # the Compose port mapping redirects host:5353 → container:53 without the
    # container process binding a privileged port (though NSD's configure
    # defaults to port 53, Docker's port mapping + USER nobody works because
    # Docker handles the interface binding, not NSD; NSD binds inside the netns).
    cap_drop:
      - ALL

    restart: "no"  # benchmark tooling manages lifecycle; don't auto-restart