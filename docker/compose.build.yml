# docker/compose.build.yml — CLIMB Phase 1 build verification
#
# Builds the full liboqs + libMTL toolchain from pinned submodules,
# then runs the upstream test/ suite and examples/test.sh.
#
# Usage:
#   docker compose -f docker/compose.build.yml build
#   docker compose -f docker/compose.build.yml up --exit-code-from climb-smoke
#
# Or one-shot (build + test):
#   docker compose -f docker/compose.build.yml up --build --exit-code-from climb-smoke
#
# FIX-2 (2026-09-26): patched test/mtltest_mtllib.c for liboqs 0.16.0 compat
# — compile-time OQS_SIG_*_length_public_key macros replaced with runtime
# OQS_SIG_new()->length_public_key. liboqs now builds with both SLH-DSA and
# ML-DSA families (ML-DSA needed for upstream test vectors).

services:

  # ── Build & verification service ──────────────────────────────────────
  climb-smoke:
    build:
      context: ..
      dockerfile: docker/Dockerfile.build
      target: builder
    command: >
      sh -c '
        set -e;
        echo "============================================================";
        echo " VERIFICATION — library artifacts present";
        echo "============================================================";
        ls -la /usr/local/lib/libmtlslib.so* /usr/local/lib/liboqs.so*;
        ls /usr/local/include/mtllib/;
        echo;
        echo "============================================================";
        echo " UPSTREAM TEST SUITE — test/mtltest";
        echo "============================================================";
        cd /src/MTL;
        LD_LIBRARY_PATH=/usr/local/lib ./test/mtltest;
        echo;
        echo "============================================================";
        echo " UPSTREAM EXAMPLE — examples/test.sh";
        echo "============================================================";
        LD_LIBRARY_PATH=/usr/local/lib bash examples/test.sh;
        echo;
        echo "============================================================";
        echo " ALL TESTS PASSED";
        echo "============================================================";
      '