# docker/compose.batch4.yml — CLIMB Batch 4 (Phases 12–13)
#
# Runs NSD-MTL (authoritative) + Unbound-MTL (recursive validator) on a
# shared, internal-only bridge network. Both services resolve by name
# (nsd / unbound) plus static IPs for config files that need them.
#
# ── the project conventions §2.3 "No Internet deployment" compliance ──
# All host-side port bindings are to 127.0.0.1 ONLY. The internal bridge
# (climb-net) carries no default route and has no Internet access.
# Compose external network access is blocked by internal: true.
#
# Usage:
#   docker compose -f docker/compose.batch4.yml build
#   docker compose -f docker/compose.batch4.yml up -d
#   dig @127.0.0.1 -p 5354 climb.example. SOA     # query NSD directly
#   dig @127.0.0.1 -p 5355 climb.example. A +trace # query via Unbound
#   docker compose -f docker/compose.batch4.yml logs -f
#   docker compose -f docker/compose.batch4.yml down

services:

  # ── Authoritative: NSD-MTL (Phase 12) ───────────────────────────────
  nsd:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nsd
    image: climb-nsd:phase12

    ports:
      - "127.0.0.1:5354:53/udp"
      - "127.0.0.1:5354:53/tcp"

    volumes:
      - ./zones:/etc/nsd/zones:ro
      - ./configs/nsd.conf:/etc/nsd/nsd.conf:ro

    cap_drop:
      - ALL

    restart: "no"

    networks:
      climb-net:
        ipv4_address: 192.168.13.2

  # ── Recursive validator: Unbound-MTL (Phase 13) ─────────────────────
  unbound:
    build:
      context: ..
      dockerfile: docker/Dockerfile.unbound
    image: climb-unbound:phase13

    # Unbound host-side port: 5355 (5354 = NSD)
    ports:
      - "127.0.0.1:5355:53/udp"
      - "127.0.0.1:5355:53/tcp"

    volumes:
      - ./configs/unbound.conf:/etc/unbound/unbound.conf:ro

    cap_drop:
      - ALL

    restart: "no"

    networks:
      climb-net:
        ipv4_address: 192.168.13.3

    # Unbound needs NSD up first (stub-zone queries fail without it)
    depends_on:
      - nsd

# ── Shared internal bridge ────────────────────────────────────────────
networks:
  climb-net:
    name: climb-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.13.0/24