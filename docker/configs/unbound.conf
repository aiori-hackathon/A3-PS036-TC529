# docker/configs/unbound.conf — CLIMB Unbound-MTL recursive resolver
#
# Recursive resolver configured to query the NSD-MTL authoritative
# server via a stub-zone for climb.example. — NOT via root hints (NSD is
# not a root server and the zone is a private example zone, not delegated).
#
# ── MTL mode ──
# enable-edns-sigtag-mtl: yes  —  advertise cached ladders to NSD via
# EDNS option 65050 so NSD can send condensed signatures instead of full
# ladders. Requires NSD built with --enable-draft-mtl.
#
# ── DNSSEC status ──
# The zone is currently UNSIGNED (the verisign/mtl-mode-ldns signer is not
# yet vendored). DNSSEC validation is
# therefore disabled for climb.example. via domain-insecure.

server:
    interface: 0.0.0.0
    port: 53

    # No DNSSEC validation for climb.example. (zone is unsigned —
    # blocked on mtl-mode-ldns signer integration).
    # Using bare iterator (no validator) until the zone is signed.
    module-config: "iterator"
    domain-insecure: "climb.example."

    # Allow localhost queries for host-side dig testing
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow

    # Do not try to query localhost — NSD is at 192.168.13.2
    do-not-query-localhost: yes

    # ── MTL mode ──────────────────────────────────────────────────────
    enable-edns-sigtag-mtl: yes
    ladder-cache-size: 4m
    ladder-cache-slabs: 4

    # ── Runtime ───────────────────────────────────────────────────────
    username: ""
    directory: "/var/lib/unbound"
    pidfile: "/run/unbound/unbound.pid"
    chroot: ""
    logfile: ""
    use-syslog: no
    verbosity: 2
    statistics-interval: 0
    extended-statistics: yes
    # Interface-automatic: no — don't listen on :0 or auto-detect; explicit only
    interface-automatic: no

    # ── Performance ───────────────────────────────────────────────────
    num-threads: 1
    msg-cache-size: 4m
    rrset-cache-size: 8m
    neg-cache-size: 1m
    outgoing-range: 128
    num-queries-per-thread: 128
    so-reuseport: yes

# ── Stub zone for climb.example. ───────────────────────────────────────
# NSD is authoritative for climb.example. at 192.168.13.2:53 on the
# internal bridge network (see compose.dns-pipeline.yml). A stub-zone bypasses
# root hints and queries NSD directly — correct for a private, undelegated
# example zone.
#
# Note: the zone's own NS glue points at ns1.climb.example. → 127.0.0.1
# (a host-local entry in the zone file, see docker/zones/climb.example.zone:28).
# This glue is meaningless inside the container. The stub-addr pin overrides
# it on the initial query, but stub-prime/no would chase the glue and fail.
# We set stub-prime: no to prevent that.
stub-zone:
    name: "climb.example."
    stub-addr: 192.168.13.2@53
    stub-prime: no
    stub-first: yes

# ── Remote control (unbound-control) ───────────────────────────────────
# Disabled — TLS certs not provisioned in this container image.
# Enable if you need unbound-control stats for the ladder cache.
remote-control:
    control-enable: no