# docker/configs/nsd.conf — CLIMB Phase 12
#
# Minimal NSD configuration for serving the climb.example. zone.
# Hard constraints (the project conventions §2):
#   - No Internet deployment: binds to container-internal interfaces only
#     (ip-address: 0.0.0.0 inside the container, but the Compose file maps
#     ports exclusively to 127.0.0.1 on the host)
#   - No resolver implementation from scratch: uses the patched NSD fork
#     (verisign/mtl-mode-nsd @ IETF-126-Interim)

server:
    # Container-internal bind (isolated from host by Compose port mapping)
    ip-address: 0.0.0.0
    port: 53

    # MTL mode (EDNS opcode 65050) — enabled at build time via --enable-draft-mtl
    # No config flag needed; the opcode is compiled in.

    # The container runs as USER nobody (see Dockerfile.nsd). NSD itself
    # must not attempt another user switch.
    username: ""

    # Zone directory (mounted from host via Compose volume)
    zonesdir: "/etc/nsd/zones"
    database: ""             # no persistent DB (fresh load each start)
    logfile: "/dev/stdout"   # visible in docker logs

    # Low security margins for local-only benchmark serving
    verbosity: 2

zone:
    name: "climb.example."
    zonefile: "climb.example.zone"